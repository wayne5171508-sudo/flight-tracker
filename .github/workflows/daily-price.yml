name: Daily flight price check
on:
  schedule:
    # GitHub 排程在這個 repo 實際會晚 4~5 小時才開跑(14:00 的排程常到 18:40 才跑),
    # 導致 Claude 14:50 的同步任務每天都等不到資料、只好自己開 Chrome 重查一次。
    # 改成 09:00 先跑一次,13:00 再補一次(同一天第二次會保留成功的價格),14:50 前通常就有資料。
    - cron: '0 1 * * *'   # 09:00 Taipei
    - cron: '0 5 * * *'   # 13:00 Taipei
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: prices
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-save playwright@1.47.2
      - run: npx playwright install --with-deps chromium
      - run: node scripts/scrape.mjs
      - name: Commit prices.json
        run: |
          git config user.name "flight-bot"
          git config user.email "flight-bot@users.noreply.github.com"
          git add prices.json
          git diff --cached --quiet && echo "no change" && exit 0
          git commit -m "每日查價 $(TZ=Asia/Taipei date +%F)"
          git pull --rebase
          git push
